# Proposal: runaway-budget (Wave-2 Lane 5 — sequence + budget rules)
#
# Session-activity budget rules, mode: observe. Three metrics were in
# scope: total tool calls, total Bash calls, and elapsed active time.
#
# ── What shipped ──────────────────────────────────────────────────────
# 'type: rate' (packages/core/src/enforce/pipeline.ts, StateManager.
# checkRateLimit) already expresses a genuine long-window CUMULATIVE
# budget: the window anchor only resets when a gap LARGER than
# window_seconds occurs between calls, so for a continuously-active
# session (calls seconds/minutes apart) the count accumulates across the
# entire window — exactly "N calls in a W-second budget", not a sliding
# per-minute rate. No core change was needed; both rules below are pure
# YAML.
#
#   - total tool calls: 'match: ".*"' is REQUIRED, not decorative. When
#     'rule.match' is absent, pipeline.ts falls back to
#     'matchPattern = input.tool', which keys the rate counter PER TOOL
#     NAME — that silently shards one counter into N per-tool counters
#     and defeats a "total calls across every tool" budget. 'match: ".*"'
#     matches every call (the haystack is always non-empty) while keeping
#     one shared counter keyed by the constant pattern string. Do not
#     "clean up" this '.*' as apparently redundant — it is load-bearing.
#   - total Bash calls: 'match: "Bash"' (same pattern the shipped
#     'bash-rate-limit' rule already uses), scoped to the 4h/500-call
#     budget instead of bash-rate-limit's 60s/30-call loop-storm window.
#
# ── What was investigated and SKIPPED ───────────────────────────────────
# Elapsed active time ("the session has been running for N hours") is NOT
# the same shape as a call-count budget and 'type: rate' cannot express
# it, with or without a core extension that stays honest:
#   - 'EnforceInput' carries no session-start timestamp, and the rate
#     evaluator's window anchor is keyed '{ruleId}:{matchPattern}' with
#     NO session_id and a 24h TTL — a naive "first call sets the anchor,
#     fire once now - anchor >= threshold" extension would let the FIRST
#     call of a brand-new session inherit an anchor left over from a
#     PRIOR session that used the same key, and report "session active
#     for 4 hours" on a session that just started. That is a control that
#     lies, which is worse than shipping nothing.
#   - Fixing that properly needs a session-scoped anchor (keyed by
#     session_id, or a 'session_started_at' field threaded onto
#     EnforceInput) — a real primitive addition, not a minimal one, and
#     arguably belongs with the 'type: session' / 'max_duration_minutes'
#     machinery that is already declared in the type system but
#     deliberately marked NOT IMPLEMENTED in rule-parser.ts's
#     'notImplemented' set (mcp, inheritance, meta, session, context).
#     Reviving that boundary was not this lane's mandate.
#   - Token budgets are excluded for the same class of honesty reason:
#     they are not visible to keel's enforcement hook at all (no token
#     count is ever passed to 'EnforceInput' outside 'context_tokens',
#     which measures re-injection thresholds, not a budget ceiling) — this
#     was flagged as out of scope up front rather than fabricated.
# FOLLOW-UP for the supervisor / a later wave: add a session-scoped
# elapsed-time primitive (session_id-keyed anchor, or a session-start
# timestamp on EnforceInput) before attempting an "elapsed active time"
# rule. Do not key it off '{ruleId}:{matchPattern}' the way call-rate
# budgets are keyed.
#
# Paste this list (2 rules) into DEFAULT_RULES_YAML in BOTH
# packages/cli/src/commands/install.ts and packages/cli/src/commands/
# plugin.ts at the Wave-2 gate. Each rule id needs its own
# tests/rules/<id>/{must-block,must-allow}.yaml fixture dir once pasted,
# per the per-rule fixture harness contract (packages/cli/src/__tests__/
# fixture-harness.test.ts).

- id: runaway-budget-tool-calls
  type: rate
  mode: observe
  category: workflow
  severity: low
  confidence: high
  rationale: >
    Budget-model precedent (Cloudflare WAF log mode, OPA Gatekeeper
    dryrun): total tool-call volume in a long window is a coarse proxy for
    a runaway loop or scope-creep session. Observe mode measures the real
    hit rate against legitimate long sessions before this ever interrupts
    anyone. Token budgets are not visible to keel's enforcement hook and
    are intentionally NOT modeled by this rule.
  false_positives:
    - long legitimate refactors
    - batch operations
  match: ".*"
  window_seconds: 14400
  max_calls: 500
  action: warn
  message: "More than 500 tool calls in this session's last 4 hours — possible runaway loop or scope creep."

- id: runaway-budget-bash-calls
  type: rate
  mode: observe
  category: workflow
  severity: low
  confidence: high
  rationale: >
    Same budget-model precedent as runaway-budget-tool-calls, scoped to
    Bash specifically: a runaway shell loop can stay under the total
    tool-call ceiling while still hammering the shell. Observe mode
    measures the real hit rate before this interrupts anyone. Token
    budgets are not visible to keel and are intentionally NOT modeled.
  false_positives:
    - long legitimate refactors
    - batch operations
  match: "Bash"
  window_seconds: 14400
  max_calls: 500
  action: warn
  message: "More than 500 Bash calls in this session's last 4 hours — possible runaway loop or scope creep."
