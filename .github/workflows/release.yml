name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.12.0'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: git diff --exit-code -- packages/cli/templates/keel-enforce.js
      - run: node scripts/check-packages.mjs
      - run: node scripts/check-tarballs.mjs
      - run: npm test
      - run: npx vitest run packages/cli/src/__tests__/cli.test.ts
      - run: npm run lint
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: git diff --exit-code -- packages/cli/templates/keel-enforce.js
      - run: node scripts/check-packages.mjs
      - run: node scripts/check-tarballs.mjs
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Publish core
        run: node scripts/publish-if-missing.mjs packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CLI
        run: node scripts/publish-if-missing.mjs packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish OpenCode plugin
        run: node scripts/publish-if-missing.mjs packages/opencode-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published packages
        run: node scripts/check-published.mjs
      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
