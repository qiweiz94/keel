name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.12.0']

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # Runs on all three platforms. The suites previously used POSIX shell
      # calls (`mktemp -d`, `rm -rf`, `chmod`) for fixtures, so Windows ran
      # lint only — a three-OS matrix reporting a type-check as coverage.
      # Those are Node APIs now; the handful of suites that put a
      # `#!/bin/bash` shim on PATH are gated by `describePosixShim`
      # (see src/__tests__/helpers/platform.ts) rather than skipped wholesale.
      - run: npm test
      - run: npx vitest run packages/cli/src/__tests__
        env:
          CI: true
      - run: npm run lint
      # The npm-shim retry test uses a POSIX shebang shim; the underlying
      # check-published.mjs is what release.yml consumes (ubuntu-only).
      - run: npm run test:publish-check
        if: matrix.os != 'windows-latest'
