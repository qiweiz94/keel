name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.12.0']

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # Windows still runs lint only — but the reason is now specific and
      # tracked, not a blanket "assumes POSIX". Enabling the suites there
      # surfaced four distinct classes, in rough order of size:
      #   1. CRLF checkout broke source-reading regexes and line counts.
      #      Fixed at the root by .gitattributes (eol=lf).
      #   2. EBUSY on rmdir — Windows will not remove a directory a spawned
      #      child process still holds open. Fixture teardown needs a retry.
      #   3. Path-pattern semantics: negated paths and separator handling in
      #      the core matcher genuinely differ. Real work, in the roadmap.
      #   4. PATH-shim suites, already gated by `describePosixShim`.
      # Fixture plumbing (mktemp/rm -rf/chmod → Node APIs) is done, so 1 and
      # 4 are handled; 2 and 3 are what remain before this flag comes off.
      - run: npm test
        if: matrix.os != 'windows-latest'
      - run: npx vitest run packages/cli/src/__tests__
        if: matrix.os != 'windows-latest'
        env:
          CI: true
      - run: npm run lint
      # The npm-shim retry test uses a POSIX shebang shim; the underlying
      # check-published.mjs is what release.yml consumes (ubuntu-only).
      - run: npm run test:publish-check
        if: matrix.os != 'windows-latest'
