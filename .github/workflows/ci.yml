name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.12.0']

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # Test suites assume POSIX path semantics in rule patterns (negated
      # paths, /tmp-style fixtures). Windows: install/build/lint/audit are
      # verified; vitest suites run on posix until the core matcher
      # normalizes path separators (see ROADMAP "Windows path semantics").
      - run: npm test
        if: matrix.os != 'windows-latest'
      - run: npx vitest run packages/cli/src/__tests__
        if: matrix.os != 'windows-latest'
        env:
          CI: true
      - run: npm run lint
      # The npm-shim retry test uses a POSIX shebang shim; the underlying
      # check-published.mjs is what release.yml consumes (ubuntu-only).
      - run: npm run test:publish-check
        if: matrix.os != 'windows-latest'
