name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      # Integration suites run against the built dist/, so they must come
      # after `npm run build`. Covers cli / hook / install, not just cli.
      - run: npx vitest run packages/cli/src/__tests__
        env:
          CI: true
