# (Legacy) — new rules in CLAUDE.md with Keel YAML frontmatter
version: "1.0"
name: "keel self-governance (legacy)"
settings:
  default_action: warn
  audit_log: true

command_rules:
  - name: "Block destructive commands"
    patterns:
      - regex: '^rm -rf /'
      - regex: '^rm -rf ~'
      - regex: 'pkill.*-f.*python'
    action: block
    message: "Destructive command blocked."

  - name: "Restrict sudo usage"
    patterns:
      - prefix: "sudo "
    action: block
    message: "Sudo commands blocked by default."

  - name: "Block git hook bypass"
    patterns:
      - regex: 'git.*--no-verify'
      - regex: 'git push --force(?!-with-lease)'
      - regex: "core\\.hooksPath"
    action: block
    message: "Git hook bypass is not allowed."

  - name: "Require safe force-push"
    patterns:
      - prefix: "git push --force "
    unless:
      - regex: 'git push --force-with-lease'
    action: block
    message: "Use --force-with-lease instead."

  - name: "Safe package installers"
    patterns:
      - regex: '^npm (install|add|i)'
      - regex: '^pnpm (install|add|i)'
      - regex: '^yarn add'
    action: allow
    message: "Approved package manager."

file_rules:
  - name: "Protect secret files"
    paths:
      - "**/.env"
      - "**/.env.*"
      - "**/credentials*"
      - "**/*.pem"
      - "**/*-key.json"
    exclude:
      - ".env.example"
    actions:
      read: block
      write: block
    message: "Protected file: use a secrets manager instead."

  - name: "Protect git config"
    paths:
      - "**/.git/config"
      - "**/.git-credentials"
    actions:
      read: block
      write: block
    message: "Git configuration files are protected."
