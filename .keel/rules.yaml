# Project-specific Keel rules for the keel project
# These are enforced alongside global rules in ~/.keel/rules.yaml
# Project rules override global rules for the same rule id.
version: 1
rules:
  - id: source-change-requires-test
    type: verification
    trigger:
      tools: [WriteFile, edit]
      path: "src/"
      paths: ["package.json"]
      pattern: "(src/|package[.]json)"
    satisfy:
      tools: [Bash]
      pattern: "(npm test|npm run test|vitest|jest)"
    boundaries:
      commit:
        pattern: "git commit"
        action: warn
      push:
        pattern: "git push"
        action: deny
    verification_window_seconds: 300
    action: deny
    priority: 95
    message: "Source changes require a successful test run before commit or push."

  - id: claim-must-have-evidence
    type: command
    match: "(done|fixed|complete|working)"
    action: deny
    unless_reasoning: "test.*pass|verified|confirmed.*output|evidence"
    message: "Don't claim completion without evidence. Include test output or verification steps."
