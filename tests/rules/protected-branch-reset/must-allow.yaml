cases:
  - note: "reset --hard on a feature branch, explicitly named"
    tool: Bash
    args:
      command: "git reset --hard origin/feature-x"
  - note: "reset --hard with no branch name in the command (known gap — cannot see ambient checkout state)"
    tool: Bash
    args:
      command: "git reset --hard HEAD~1"
  - note: "checkout of a feature branch, then reset --hard"
    tool: Bash
    args:
      command: "git checkout feature/foo && git reset --hard"
  - note: "wave-3 regression guard: git -C prefix against a feature branch"
    tool: Bash
    args:
      command: "git -C /tmp/repo reset --hard my-feature"
