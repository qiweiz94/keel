cases:
  - note: "sudo apt-get is a common package-manager sudo usage, exempted"
    tool: Bash
    args:
      command: "sudo apt-get install build-essential"
  - note: "a scoped, non-recursive chmod"
    tool: Bash
    args:
      command: "chmod 644 file.txt"
  - note: "a word starting with 'sudo' but not the command itself (word-boundary near-miss)"
    tool: Bash
    args:
      command: "cat /etc/sudoers.d/readme.txt"
  - note: "sudo with flags before the package manager token is still exempted — the anchor scopes the scan to the same command segment, not just the very next token"
    tool: Bash
    args:
      command: "sudo -H apt-get install curl"
