cases:
  - note: "deleting an ordinary feature branch on the remote"
    tool: Bash
    args:
      command: "git push origin --delete feature/old-branch"
  - note: "deleting an ordinary local feature branch"
    tool: Bash
    args:
      command: "git branch -D feature/old-branch"
  - note: "a branch name that merely contains 'main' as a substring (word-boundary near-miss)"
    tool: Bash
    args:
      command: "git push origin --delete maintenance-branch"
  - note: "wave-3 regression guard: update-ref against an ordinary branch"
    tool: Bash
    args:
      command: "git update-ref -d refs/heads/feature-x"
