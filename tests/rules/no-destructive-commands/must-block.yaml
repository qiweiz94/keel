cases:
  - note: "rm -rf / is the canonical destructive command"
    tool: Bash
    args:
      command: "rm -rf /"
  - note: "wave-3 bypass: reversed flag letters (rm -fr) executed identically"
    tool: Bash
    args:
      command: "rm -fr /"
  - note: "wave-3 bypass: separated flags"
    tool: Bash
    args:
      command: "rm -r -f /"
  - note: "wave-3 bypass: long-form flags"
    tool: Bash
    args:
      command: "rm --recursive --force /"
  - note: "wave-3 bypass: doubled spaces between tokens"
    tool: Bash
    args:
      command: "rm  -rf  /"
  - note: "wave-3 bypass: $HOME instead of the tilde"
    tool: Bash
    args:
      command: "rm -rf $HOME"
  - note: "wave-3 bypass: braced ${HOME}"
    tool: Bash
    args:
      command: "rm -rf ${HOME}"
  - note: "wave-3 bypass: mkfs.ext4 — the canonical spelling, missed while 'mkfs -t ext4' caught"
    tool: Bash
    args:
      command: "mkfs.ext4 /dev/disk2"
  - note: "wave-3 bypass: macOS newfs_ variant"
    tool: Bash
    args:
      command: "newfs_hfs /dev/disk2"
  - note: "wave-3 bypass: macOS diskutil eraseDisk"
    tool: Bash
    args:
      command: "diskutil eraseDisk JHFS+ blank /dev/disk2"
  - note: "wave-3 bypass: dd with the operands reversed"
    tool: Bash
    args:
      command: "dd of=/dev/disk2 if=/dev/zero"
  - note: "wave-3 bypass: dd with doubled spaces"
    tool: Bash
    args:
      command: "dd if=/dev/zero  of=/dev/disk2 bs=1m"
  - note: "v0.4 red-team: --no-preserve-root is the canonical way to actually wipe / on Linux, and was allowed in v0.3"
    tool: Bash
    args:
      command: "rm -rf --no-preserve-root /"
  - note: "v0.4 red-team: --no-preserve-root before the -rf flags (reordered) still wipes root"
    tool: Bash
    args:
      command: "rm --no-preserve-root -rf /"
