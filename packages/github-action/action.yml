name: 'AI Enforce Check'
description: 'Check PR changes against AI coding assistant governance policies'
author: 'nanoclaw'
inputs:
  policy-path:
    description: 'Path to .keel.yaml policy file'
    required: false
    default: '.keel.yaml'
runs:
  using: 'composite'
  steps:
    - run: npm install -g keel
      shell: bash
    - run: keel check --ci
      shell: bash
